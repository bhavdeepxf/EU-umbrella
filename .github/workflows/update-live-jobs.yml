name: Fetch jobs and deploy EU Umbrella

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and score jobs
        env:
          BA_JOBS_API_KEY: ${{ secrets.BA_JOBS_API_KEY }}
        run: python scripts/fetch_and_score_jobs.py

      - name: Check generated job data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/live-jobs.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(payload, dict) or not isinstance(payload.get("jobs"), list):
              raise SystemExit("Expected data/live-jobs.json to contain a jobs array")

          print("Generated at:", payload.get("generatedAt"))
          print("Number of jobs:", len(payload["jobs"]))

          if not payload["jobs"]:
              raise SystemExit("No real jobs were collected; refusing to replace the working site with empty data")

          if any(str(job.get("title", "")).startswith("Test Live Job") for job in payload["jobs"]):
              raise SystemExit("Test jobs are still present; refusing to publish them as live results")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
