name: Refresh jobs and deploy EU Umbrella

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependency
        run: python -m pip install --requirement requirements.txt
      - name: Fetch and rank current vacancies
        run: python scripts/fetch_and_score_jobs.py
      - name: Validate generated data and scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("data/live-jobs.json").read_text(encoding="utf-8"))
          jobs=payload.get("jobs")
          if not isinstance(jobs,list) or not jobs: raise SystemExit("No publishable jobs")
          required={"title","company","url","technicalFit","attainability","matchScore","region","roleFamilies"}
          for i,job in enumerate(jobs):
              missing=required-set(job)
              if missing: raise SystemExit(f"Job {i} missing {sorted(missing)}")
              if not str(job["url"]).startswith("https://"): raise SystemExit(f"Job {i} URL is not HTTPS")
          print(f"Validated {len(jobs)} current vacancies")
          PY
          node --check app.js
          node --check jobs.js
          node --check data/candidate-profile.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
