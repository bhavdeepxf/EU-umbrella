name: Refresh jobs and deploy EU Umbrella
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect current vacancies
        run: python fetch_jobs.py
      - name: Validate data and JavaScript
        run: |
          python validate_data.py
          node --check app.js
          node --check jobs.js
          node --check candidate-profile.js
      - name: Commit refreshed feed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jobs.json
          git diff --cached --quiet || git commit -m "chore: refresh European vacancy feed"
          git push
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: |
          mkdir -p site
          cp index.html style.css app.js jobs.js candidate-profile.js jobs.json site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
